name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Check mixin targets
        run: bash tools/audit-mixins.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: altoclefplus-${{ github.sha }}
          path: build/libs/altoclefplus-*.jar
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: http/) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat >> release-notes.md <<'NOTES'

          ---

          **Install:** Minecraft 1.18.2 with Fabric Loader 0.14+. Put the official
          [AltoClef v0.4.1](https://github.com/gaucho-matrero/altoclef/releases/tag/v0.4.1) jars and the
          `altoclefplus` jar below into your `mods` folder, then press **Right Shift** in game.
          Full guide: [README](https://github.com/Creeperhouse999/Altoclef-Plus#install).

          AltoClef Plus is unofficial and not affiliated with the AltoClef or Baritone projects.
          NOTES
          sed -i 's/^          //' release-notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AltoClef Plus ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            build/libs/altoclefplus-*.jar
            !build/libs/*-sources.jar
